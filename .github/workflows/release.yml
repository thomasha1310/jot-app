name: Release

# Publishes a GitHub Release with installers whenever a version tag is pushed.
# Create one with:  npm version minor && git push --follow-tags
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04's older glibc lets the Linux builds run on older distros too.
        platform: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json ($version). Release with 'npm version', which sets both."
            exit 1
          fi

      - name: Install system libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Test
        if: runner.os == 'Linux'
        run: npm test

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: jot ${{ github.ref_name }}
          releaseBody: |
            **Windows:** download the `.msi`, or the `-setup.exe`.
            **Linux:** the `.AppImage` runs anywhere (`chmod +x` it first); `.deb` for Debian/Ubuntu, `.rpm` for Fedora/openSUSE.

            The builds aren't code-signed, so Windows SmartScreen may warn the first time you run it ("More info" → "Run anyway").
          releaseDraft: false
          prerelease: false
