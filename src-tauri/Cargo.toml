[package]
name = "jot"
version = "0.1.0"
description = "jot., a local-first planner for coursework"
edition = "2024"
rust-version = "1.90"

[lib]
name = "jot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# rustdoc can't link doctests for a staticlib crate, and there are none.
doctest = false

[build-dependencies]
tauri-build = { version = "2.7.5", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.6", features = [] }
tauri-plugin-dialog = "2"
